# Goal: to create CICD pipeline (dummy)

name: CICD pipeline Demo

on: 
 push:

jobs:
  code:
   runs-on: ubuntu-latest
   steps:
     - name: Clone the code
       uses: actions/checkout@v7
  build:
   needs: code
   runs-on: ubuntu-latest
   steps:
     - name: Build docker image
       uses: docker/setup-buildx-actions@v3
  test:
   needs: build
   runs-on: ubuntu-latest
   steps:
     - name: Test the application
       run: echo "tested the application"
  deploy:
   needs: [code,build,test]
   runs-on: ubuntu-latest
   steps:
     - name: deploy the application
       run: echo "Deployed the application"
